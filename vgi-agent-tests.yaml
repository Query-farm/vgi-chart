# Private grader sidecar for `vgi-lint simulate` (and `lint`'s VGI520 coverage).
# The worker publishes only task names + prompts in `vgi.agent_test_tasks`
# (Main.AGENT_TEST_TASKS_JSON); these grader fields are keyed by that name and
# never sent to the analyst agent (VGI416).
#
# A rendered PNG is not byte-stable across platforms, so every reference grades
# on a deterministic bounded property (the result-row count, or a "PNG larger
# than 100 bytes" boolean), never on exact bytes.
tasks:
  - name: bar chart row count
    reference_sql: |-
      SELECT count(*) AS n FROM chart.main.chart_bar((SELECT * FROM (VALUES ('A', 30), ('B', 45), ('C', 12)) AS t(category, value)), category := 'category', value := 'value')
    success_criteria: The bar chart function returns exactly one row, so the answer is 1.
    ignore_column_names: true

  - name: line chart row count
    reference_sql: |-
      SELECT count(*) AS n FROM chart.main.chart_line((SELECT * FROM (VALUES (1, 10), (2, 25), (3, 18), (4, 30)) AS t(x, y)), x := 'x', y := 'y')
    success_criteria: The line chart function returns exactly one row, so the answer is 1.
    ignore_column_names: true

  - name: pie chart png size check
    reference_sql: |-
      SELECT octet_length(png) > 100 AS ok FROM chart.main.chart_pie((SELECT * FROM (VALUES ('X', 65), ('Y', 35)) AS t(label, value)), label := 'label', value := 'value')
    success_criteria: The rendered pie chart PNG is larger than 100 bytes, so the result is true.
    ignore_column_names: true

  - name: scatter plot row count
    reference_sql: |-
      SELECT count(*) AS n FROM chart.main.chart_scatter((SELECT * FROM (VALUES (1.0, 2.1), (2.0, 3.9), (3.0, 1.5)) AS t(x, y)), x := 'x', y := 'y')
    success_criteria: The scatter plot function returns exactly one row, so the answer is 1.
    ignore_column_names: true

  - name: histogram png size check
    reference_sql: |-
      SELECT octet_length(png) > 100 AS ok FROM chart.main.chart_histogram((SELECT * FROM (VALUES (1.0), (1.5), (2.0), (2.5), (3.0)) AS t(value)), value := 'value', bins := 5)
    success_criteria: The rendered histogram PNG is larger than 100 bytes, so the result is true.
    ignore_column_names: true

  - name: chart type catalog count
    reference_sql: |-
      SELECT count(*) AS n FROM chart.main.chart_types()
    success_criteria: The count of rows in the chart_types catalog, one per supported chart type.
    ignore_column_names: true
